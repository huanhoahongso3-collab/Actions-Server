# How often should automatic messages be sent?
delay: 256s
# Defines the selection strategy for automatic messages.
# RANDOM - messages are chosen randomly.
# SEQUENTIAL - messages are sent in order.
mode: RANDOM
# List of automatic messages to be dispatched.
# Supports different Notice types like chat, actionbar, title, boss bar.
messages:
- "<dark_gray>[<red>!<dark_gray>] <rainbow>Server sẽ khởi động lại vào (Server will restart on): <gray>0,7,13,18 UTC+7"
- actionbar: "<dark_gray>[<yellow>!<dark_gray>] <rainbow>Server sẽ khởi động lại vào (Server will restart on): <gray>0,7,13,18 UTC+7"
- bossbar:
    message: "<dark_gray>[<red><bold>!<dark_gray>] <rainbow>Server sẽ khởi động lại vào (Server will restart on): <gray>0,7,13,18 UTC+7"
    duration: 15s
    color: ORANGE
    overlay: PROGRESS
